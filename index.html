<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="Offline CardioThoracic MCQ study app with tag-based sections, quizzes, progress and review.">
  <title>CardioThoracic Atlas</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <header class="topbar">
    <button class="brand" data-route="home" aria-label="Home">
      <span class="brand-mark">CT</span><span><strong>CardioThoracic Atlas</strong><small>8th Semester • Offline Edition</small></span>
    </button>
    <div class="top-actions">
      <button class="icon-btn" id="themeToggle" title="Toggle theme">◐</button>
      <button class="icon-btn" data-route="settings" title="Settings">⚙</button>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <nav class="bottom-nav" aria-label="Primary navigation">
    <button data-route="home"><span>⌂</span><small>Home</small></button>
    <button data-route="browse"><span>⌕</span><small>Browse</small></button>
    <button data-route="quiz"><span>✦</span><small>Quiz</small></button>
    <button data-route="insights"><span>◔</span><small>Insights</small></button>
    <button data-route="settings"><span>⚙</span><small>Settings</small></button>
  </nav>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
